<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bank-Cards</title>
    <link rel="stylesheet" href="css/account.css">
</head>
<body class="">
    <div class="profile-container">
        <img src="src/img/account.jpg" class="profile__img" alt="">
        <h3 class="profile__text">User</h3>
        <span class="profile__text">user@gmail.com</span>
    </div>
    <div class="cards-container">
        <div class="cards">
            <div class="card">
                <span class="card__el title">MIR</span>
                <span class="card__el">1112223334353456</span>
            </div>
        </div>
        <div class="add_card">
            <button class="add_card__button modal-window-open-btn">+ Add payment method</button>
        </div>
    </div>
    <div class="modal-window">
        <form action="">
            <input type="number" placeholder="card number" class="card-number-input">
            <label for="city">Payment system: 
            <select name="city" id="city" class="payment-system" required>
                <option value="MIR">MIR</option>
                <option value="VISA">VISA</option>
                <option value="MasterCard">MasterCard</option>
                <option value="UnionPay">UnionPay</option>
            </select>
            </label>
            <button class="add_card__button margin-top add-card-btn">Add card</button>
            <button class="add_card__button close-window-btn">Cancel</button>          
        </form>   
    </div>
    <script src="/js/api.js" type="module"></script>
    <script src="/js/addCards.js" type="module"></script>
</body>
</html>
